name: home-energy
x-backend-environment: &backend-environment
  ConnectionStrings__Default: "Server=mssql;Database=EnergyDash;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};Encrypt=true;TrustServerCertificate=true"
  DATA_PROTECTION_CERT: /run/secrets/data-protection.pfx
  DATA_PROTECTION_CERT_PASSWORD: ${DATA_PROTECTION_CERT_PASSWORD:?Set certificate password}
  Octopus__ApiKey: ${Octopus__ApiKey:-}
  Octopus__AccountNumber: ${Octopus__AccountNumber:-}
  Tesla__ClientId: ${Tesla__ClientId:-}
  Tesla__ClientSecret: ${Tesla__ClientSecret:-}
  Tesla__RefreshToken: ${Tesla__RefreshToken:-}
  Tesla__Region: ${Tesla__Region:-eu}
  Smtp__Host: ${Smtp__Host:-}
  Smtp__Port: ${Smtp__Port:-587}
  Smtp__From: ${Smtp__From:-}
  Smtp__User: ${Smtp__User:-}
  Smtp__Password: ${Smtp__Password:-}
  Smtp__Tls: ${Smtp__Tls:-StartTls}
  Ntfy__Topic: ${Ntfy__Topic:-}
  Ntfy__BaseUrl: ${Ntfy__BaseUrl:-https://ntfy.sh}
  Ntfy__Token: ${Ntfy__Token:-}
  TZ: Europe/London
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes: [mssql-data:/var/opt/mssql]
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args: {PROJECT: EnergyDash.Api}
    environment:
      <<: *backend-environment
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
      Database__MigrateOnStartup: "true"
      SampleMode: "false"
      # Compose keeps its separate worker; production IIS hosts Quartz in the API instead.
      Scheduling__Enabled: "false"
    volumes: ["${DATA_PROTECTION_CERT:?Set DATA_PROTECTION_CERT}:/run/secrets/data-protection.pfx:ro"]
    depends_on: {mssql: {condition: service_healthy}}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
      args: {PROJECT: EnergyDash.Worker}
    environment:
      <<: *backend-environment
    volumes: ["${DATA_PROTECTION_CERT}:/run/secrets/data-protection.pfx:ro"]
    depends_on: {mssql: {condition: service_healthy}, api: {condition: service_healthy}}
    healthcheck:
      test: [CMD-SHELL, "test -f /tmp/energy-worker-heartbeat && test $$(($$(date +%s)-$$(stat -c %Y /tmp/energy-worker-heartbeat))) -lt 180"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: web/Dockerfile}
    environment:
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?Set bcrypt password hash}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      API_BASE_URL: http://api:8080
      TZ: Europe/London
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
volumes:
  mssql-data:
