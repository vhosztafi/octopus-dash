<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1214">
  <title>Offline · Home Energy</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0e1214; color: #e8ecea; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 440px; padding: 32px; background: #151b1e; border: 1px solid #2a3437; border-radius: 12px; }
    .brand { color: #6fd39a; font-size: 14px; font-weight: 600; }
    h1 { margin: 16px 0; font-size: 28px; line-height: 1.2; }
    p { color: #a9b4b2; }
    a { display: inline-block; margin-top: 12px; padding: 10px 18px; border: 1px solid #3a4548; border-radius: 6px; color: #e8ecea; text-decoration: none; }
    a:hover, a:focus-visible { border-color: #6fd39a; outline: 2px solid #6fd39a; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Home energy</div>
    <h1>You’re offline</h1>
    <p>Reconnect to view your energy readings and prices. Your household data is only available with a live connection.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
